aid: amazon-iot-twinmaker
name: Amazon IoT TwinMaker
description: AWS IoT TwinMaker makes it easier for developers to create digital twins of real-world systems such as buildings,
  factories, and industrial equipment. You can use AWS IoT TwinMaker to build operational digital twin applications to visualize,
  monitor, and diagnose complex operational systems.
